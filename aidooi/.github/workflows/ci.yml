name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aidooi
          POSTGRES_PASSWORD: aidooi
          POSTGRES_DB: aidooi
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U aidooi -d aidooi"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://aidooi:aidooi@localhost:5433/aidooi
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Generated artefacts must be committed in sync with their source.
      - name: Database types are current
        run: pnpm --filter @aidooi/db db:check
      - name: Generated API client types are current
        run: pnpm --filter @aidooi/api-client check
      - name: Design tokens CSS is current
        run: pnpm --filter @aidooi/ui-tokens check
      - name: OpenAPI document is current
        run: |
          pnpm --filter @aidooi/api openapi
          git diff --exit-code packages/contracts/openapi.json

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
